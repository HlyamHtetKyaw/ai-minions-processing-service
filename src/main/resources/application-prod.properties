# Hide internal exception details in public error responses.
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.aiminions.processingservice=${LOG_LEVEL_PROCESSING_SERVICE:INFO}

# Constrain ffmpeg worker pressure for shared hosts.
app.processing.workspace-export-ffmpeg-threads=${APP_WORKSPACE_EXPORT_FFMPEG_THREADS:2}
app.processing.workspace-export-image-prep-threads=${APP_WORKSPACE_EXPORT_IMAGE_PREP_THREADS:2}

# Keep stream queue mode by default for durability.
app.processing.queue-mode=${APP_PROCESSING_QUEUE_MODE:stream}

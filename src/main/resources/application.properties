spring.application.name=processingservice
server.port=8082
# Expose the root cause in JSON error responses (e.g. export failures) for debugging; tune for production if needed.
server.error.include-message=always

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Default matches main-service and docker-compose (redis --requirepass mypassword).
spring.data.redis.password=${REDIS_PASSWORD:mypassword}

# Subscribe to transcribe jobs (set false in tests without Redis)
app.processing.consume-jobs=${APP_PROCESSING_CONSUME_JOBS:true}

# Callback to main-service (must match app.worker.token there).
app.processing.main-service-base-url=${MAIN_SERVICE_BASE_URL:http://localhost:8081}
app.processing.worker-token=${WORKER_INTERNAL_TOKEN:}
app.processing.ai-service-base-url=${AI_SERVICE_BASE_URL:http://localhost:8080}
app.processing.redis-job-channel=ai-minions:jobs:transcribe
app.processing.generation-status-channel-prefix=ai-minions:generation:status:
# Video export and many jobs shell out to ffmpeg. Must be on PATH or use a full path to ffmpeg.exe.
# Windows: if you see CreateProcess error=4551 / "Application Control policy has blocked this file", the OS is blocking
# the binary (Smart App Control, WDAC, AppLocker). Point FFMPEG_BINARY at an allowed install, e.g.
#   FFMPEG_BINARY=C:\\ffmpeg\\bin\\ffmpeg.exe
# or allowlist that path in Group Policy; "Unblock" on the .exe Properties can also help for downloaded builds.
app.processing.ffmpeg-binary=${FFMPEG_BINARY:ffmpeg}
app.processing.silence-stop-duration-seconds=0.5
app.processing.silence-stop-threshold=-50dB

# Set APP_STORAGE_PROVIDER=gcp when you only use GCS, or keep aws and still set GOOGLE_APPLICATION_CREDENTIALS for gs:// URLs.
app.storage.provider=${APP_STORAGE_PROVIDER:aws}
app.storage.bucket=${APP_STORAGE_BUCKET:${APP_S3_BUCKET:}}
app.storage.region=${APP_STORAGE_REGION:${APP_S3_REGION:us-east-1}}
app.storage.endpoint=${APP_STORAGE_ENDPOINT:${APP_S3_ENDPOINT:}}
app.storage.path-style-access=${APP_STORAGE_PATH_STYLE_ACCESS:}
app.storage.presign-ttl-seconds=${APP_STORAGE_PRESIGN_TTL_SECONDS:900}
app.storage.video-edit-presign-ttl-seconds=${APP_VIDEO_EDIT_STORAGE_PRESIGN_TTL_SECONDS:900}
app.storage.gcp-credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}
app.storage.aws-access-key-id=${AWS_ACCESS_KEY_ID:}
app.storage.aws-secret-access-key=${AWS_SECRET_ACCESS_KEY:}

app.processing.subtitles-font-resource=fonts/Pyidaungsu.ttf
app.processing.subtitles-font-name=Pyidaungsu
app.processing.subtitles-font-size=22
app.processing.subtitles-margin-v=64
app.processing.subtitles-auto-convert-zawgyi=false
